<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="imagens/logo-marca.png">
<title>Admin | Keyla Lash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--black:#050403;--ink:#0c0a07;--panel:#120f0a;--line:#3b2a12;--gold:#d9a54f;--gold-light:#fcde8f;--gold-deep:#936023;--gold-grad:linear-gradient(180deg,#fcde8f 0%,#ebbb66 35%,#cd9746 65%,#936023 100%);--text:#f6efe0;--muted:#b6ab96;--red:#dd8a82;--serif:"Cinzel",Georgia,serif;--sans:"Jost",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#211909 0%,var(--black) 55%) fixed;color:var(--text);font:300 16px/1.5 var(--sans);min-height:100vh}
.top{position:sticky;top:0;z-index:5;background:rgba(10,9,7,.95);backdrop-filter:blur(8px);display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line)}
.top-brand{display:flex;align-items:center;gap:12px;color:var(--gold-light);font:500 21px var(--serif);letter-spacing:3px}.top-brand img{height:40px;width:auto}
main{max-width:1100px;margin:auto;padding:24px 18px 65px}
.main-title{font:400 clamp(22px,4vw,30px)/1.2 var(--serif);text-transform:uppercase;letter-spacing:3px;color:var(--gold-light);margin:12px 0 22px}
.tabs{display:flex;gap:9px;margin-bottom:22px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin;scrollbar-color:var(--gold-deep) transparent}
button,.tab{font:500 12px var(--sans);letter-spacing:1px;text-transform:uppercase;padding:12px 17px;border:1px solid var(--line);background:var(--panel);color:var(--gold-light);cursor:pointer;white-space:nowrap;transition:.2s;border-radius:2px}
button:hover,.tab:hover{border-color:var(--gold)}.tab.on,button.p{background:var(--gold-grad);color:var(--black);border-color:var(--gold);font-weight:600}button.d{color:var(--red);border-color:#6b3230}button:disabled{opacity:.35;cursor:default}
.box{background:var(--panel);border:1px solid var(--line);padding:20px;margin-bottom:12px;position:relative}.box:before{content:"";position:absolute;inset:6px;border:1px solid rgba(217,165,79,.07);pointer-events:none}
input,select,textarea{padding:12px;border:1px solid #3b3426;border-radius:2px;background:var(--black);color:var(--text);font:400 16px var(--sans);max-width:100%;width:100%;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:105px;resize:vertical}label{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);font-weight:500;display:block;margin:12px 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 150px;min-width:0}.row .sm{flex:0 0 110px}.row button{flex:0 0 auto}
.muted{color:var(--muted);font-size:14px}h3{margin:0 0 12px;font:500 21px var(--serif);letter-spacing:1px;color:var(--gold-light)}a{color:var(--gold-light)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}.stat{background:var(--panel);border:1px solid var(--line);padding:17px;text-align:center}.stat b{display:block;font:500 clamp(18px,3vw,25px) var(--serif);color:var(--gold-light);overflow-wrap:anywhere}.stat span{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.day{font:500 13px var(--serif);letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:20px 2px 10px}
.bk{display:flex;gap:16px;align-items:flex-start}.hr{min-width:74px;text-align:center;background:var(--black);border:1px solid var(--line);padding:11px 6px;font:500 18px var(--serif);color:var(--gold-light)}.bk>div:nth-child(2){flex:1;min-width:0}
#login{max-width:430px;margin:12vh auto 35px;display:grid;gap:12px;padding:34px}.login-head{text-align:center}.login-head img{height:86px;margin-bottom:10px}.login-head h1{font:500 26px var(--serif);letter-spacing:3px;color:var(--gold-light);margin:0}
#login label{text-align:left}#login button{width:100%}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2c2010;color:var(--gold-light);border:1px solid var(--gold);padding:12px 20px;border-radius:3px;display:none;z-index:100;box-shadow:0 8px 28px #0008;text-align:center;max-width:90vw}
.hide{display:none!important} .section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:grid;place-items:center;padding:10px;overflow:auto}.mb{background:var(--panel);border:1px solid var(--gold-deep);padding:20px;max-width:760px;width:100%;max-height:96vh;overflow:auto}
.ec{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:20px;align-items:start}
.fr{position:relative;aspect-ratio:1/1;border:1px solid var(--line);overflow:hidden;background:#120e08;touch-action:none;cursor:grab;width:100%;max-width:340px;margin:auto}
.fr img,.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}.fr.ct:before,.th.ct:before{content:"";position:absolute;inset:-24px;background:var(--im) center/cover;filter:blur(20px)}.fr.ct img,.th.ct img{object-fit:contain}
.cap{position:absolute;left:0;right:0;bottom:0;padding:38px 14px 12px;background:linear-gradient(transparent,rgba(5,4,3,.87));color:var(--gold-light);pointer-events:none}.cap b{display:block;font:500 16px var(--serif)}.cap em{font:400 14px var(--sans);font-style:normal;color:var(--text)}
.th{position:relative;flex:0 0 84px;aspect-ratio:1;border:1px solid var(--line);overflow:hidden;background:#120e08}.ph-row{display:flex;gap:12px;align-items:center}.ph-row>div:nth-child(2){flex:1;min-width:0}input[type=range]{padding:0}
@media(max-width:680px){.stats{gap:7px}.stat{padding:10px 4px}.stat span{font-size:10px}.top{padding:10px 12px}.top-brand{font-size:15px;letter-spacing:1px}.top-brand img{height:34px}main{padding:16px 12px 45px}.box{padding:14px}.bk{flex-direction:column;gap:8px}.hr{align-self:flex-start;padding:7px 11px}.ec,.section-grid{grid-template-columns:1fr}.ph-row{flex-wrap:wrap}.ph-row .row{width:100%}}
</style>
</head>
<body>
<form id="login" class="box hide">
<div class="login-head"><img src="imagens/logo-marca.png" alt=""><h1>Keyla Lash</h1><p class="muted">Acesso administrativo</p></div>
<label for="em">E-mail</label><input id="em" type="email" placeholder="Seu e-mail" autocomplete="username" required>
<label for="pw">Senha</label><input id="pw" type="password" placeholder="Sua senha" autocomplete="current-password" required>
<button class="p" type="submit">Entrar</button><div id="lerr" class="muted" role="alert"></div></form>
<div id="app" class="hide">
<div class="top"><div class="top-brand"><img src="imagens/logo-marca.png" alt="">Keyla Lash</div><button id="out" type="button">Sair</button></div>
<main><h2 class="main-title">Painel de controle</h2>
<div class="tabs" role="tablist"><button type="button" class="tab on" data-t="ag">Agendamentos</button><button type="button" class="tab" data-t="sv">Serviços e preços</button><button type="button" class="tab" data-t="di">Disponibilidade</button><button type="button" class="tab" data-t="st">Site</button><button type="button" class="tab" data-t="ft">Fotos</button></div>
<div id="ag"></div><div id="sv" class="hide"></div><div id="di" class="hide"></div><div id="st" class="hide"></div><div id="ft" class="hide"></div>
</main></div>
<div id="ed" class="md hide" role="dialog" aria-modal="true" aria-label="Editor de foto"><div class="mb"><h3 id="edt">Editar foto</h3>
<div class="ec"><div class="fr" id="fr"><img id="fi" draggable="false" alt=""><div class="cap"><b id="fcn"></b><em id="fcp"></em></div></div>
<div><label>Nome da foto</label><input id="e_t" list="svn" placeholder="Ex.: Volume Brasileiro">
<label>Valor na foto (R$, opcional)</label><input id="e_p" type="number" step="0.01" min="0" inputmode="decimal">
<label>Zoom <span id="zv"></span></label><input id="e_z" type="range" min="1" max="3" step="0.01" value="1">
<label>Brilho</label><input id="e_b" type="range" min="70" max="140" value="100">
<label>Contraste</label><input id="e_c" type="range" min="70" max="140" value="100">
<label>Enquadramento</label><select id="e_f"><option value="cover">Preencher o cartão</option><option value="contain">Foto inteira (fundo desfocado)</option></select>
<label style="margin-top:12px"><input id="e_a" type="checkbox" style="width:auto" checked> Visível no site</label>
<div class="row" style="margin-top:10px"><button type="button" id="e_ph">Trocar foto</button><button type="button" id="e_rs">Centralizar</button></div></div></div>
<p class="muted">Arraste a foto para enquadrar. Use zoom, brilho e contraste para ajustar a imagem.</p>
<div class="row"><button class="d" type="button" id="e_x">Cancelar</button><button class="p" type="button" id="e_s">Salvar foto</button></div></div></div>
<input type="file" id="fpick" accept="image/*" class="hide"><datalist id="svn"></datalist>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Mesmo projeto do index.html da Keyla (não utiliza o banco da Cecília).
const SB_URL="https://lnvojgmtrzxxlscbfnjf.supabase.co";
const SB_KEY="sb_publishable_qQG98DHw81JBG9jMjjqPZA_an2JlN9o";
const db=supabase.createClient(SB_URL,SB_KEY);
const DEF={slogan:"Realce seu olhar.",intro:"Beleza, elegância e sofisticação em cada detalhe. Especialista em extensão de cílios, para valorizar ainda mais a sua beleza.",booking_intro:"Preencha os dados e confirmamos pelo WhatsApp.",whatsapp:"5588996857297",address:"Av. Contorno Sul, Bl. 400, Apt. 104",hours_text:"a partir das 8h",instagram:"@keylalash",horarios:"08:00,14:00,19:00"};
const $=id=>document.getElementById(id), R=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function iso(n=0){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const hoje=iso(0), br=d=>String(d||"").slice(0,10).split("-").reverse().join("/");
let cfg={...DEF};
function toast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display="none",3000)}
function fail(el,error){console.error(error);$(el).innerHTML='<div class="box"><p class="muted">Não foi possível carregar os dados. Confira se a configuração SQL foi aplicada no projeto KeylaLash e tente recarregar a página.</p></div>'}
function setSection(k){document.querySelectorAll(".tab").forEach(t=>{t.classList.toggle("on",t.dataset.t===k);t.setAttribute("aria-selected",String(t.dataset.t===k))});["ag","sv","di","st","ft"].forEach(t=>$(t).classList.toggle("hide",t!==k))}
async function boot(){
  const {data:{user},error}=await db.auth.getUser();
  if(error||!user){$("login").classList.remove("hide");$("app").classList.add("hide");return}
  const r=await db.rpc("keyla_is_admin");
  if(r.error||r.data!==true){await db.auth.signOut();$("app").classList.add("hide");$("login").classList.remove("hide");$("lerr").textContent=r.error?"Banco ainda não configurado para o painel. Execute o SQL de instalação.":"Este usuário não está autorizado como administrador.";return}
  $("login").classList.add("hide");$("app").classList.remove("hide");
  await loadCfg();await Promise.allSettled([loadAg(),loadSv(),loadDi(),loadFt()]);loadSt();
}
$("login").onsubmit=async e=>{e.preventDefault();$("lerr").textContent="Entrando...";
  const {error}=await db.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
  if(error){$("lerr").textContent="E-mail ou senha incorretos ou acesso indisponível.";return}
  $("lerr").textContent="";await boot()};
$("out").onclick=async()=>{await db.auth.signOut();$("app").classList.add("hide");$("login").classList.remove("hide")};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setSection(t.dataset.t));
async function loadCfg(){const {data,error}=await db.from("keyla_settings").select("key,value");cfg={...DEF};if(error){console.error(error);toast("Configurações indisponíveis");return}(data||[]).forEach(r=>{if(Object.hasOwn(DEF,r.key))cfg[r.key]=r.value})}
// AGENDAMENTOS: a tabela original da Keyla é 'agendamentos'.
function totalDoAgendamento(s){const lista=[...String(s||"").matchAll(/\(R\$\s*([\d.,]+)\)/g)];if(!lista.length)return null;return lista.reduce((total,m)=>{const val=m[1].replace(/\./g,"").replace(",",".");return total+(Number(val)||0)},0)}
async function loadAg(){const {data,error}=await db.from("agendamentos").select("id,nome_cliente,whatsapp_cliente,servico,data_agendamento,hora_agendamento").gte("data_agendamento",hoje).order("data_agendamento").order("hora_agendamento");
 if(error)return fail("ag",error);
 const lst=data||[],h=lst.filter(b=>b.data_agendamento===hoje).length,s7=lst.filter(b=>b.data_agendamento<=iso(7)).length;
 const quant=lst.filter(b=>totalDoAgendamento(b.servico)!==null),total=quant.reduce((t,b)=>t+totalDoAgendamento(b.servico),0);
 let html='<div class="stats"><div class="stat"><b>'+h+'</b><span>Hoje</span></div><div class="stat"><b>'+s7+'</b><span>Próx. 7 dias</span></div><div class="stat"><b>'+(quant.length===lst.length?R(total):'—')+'</b><span>Previsto*</span></div></div>';
 html+='<p class="muted">*Estimativa dos próximos agendamentos com valores registrados no pedido. Não representa pagamentos recebidos.</p>';
 let anterior="";lst.forEach(b=>{const dia=String(b.data_agendamento).slice(0,10);if(dia!==anterior){anterior=dia;html+='<div class="day">'+(dia===hoje?'Hoje':dia===iso(1)?'Amanhã':br(dia))+'</div>'}
 const phone=String(b.whatsapp_cliente||"").replace(/\D/g,"");const intl=phone.startsWith("55")?phone:"55"+phone;const link=phone?'<a href="https://wa.me/'+intl+'" target="_blank" rel="noopener">'+esc(b.whatsapp_cliente)+'</a>':'Não informado';
 html+='<div class="box bk"><div class="hr">'+esc(String(b.hora_agendamento).slice(0,5))+'</div><div><b>'+esc(b.nome_cliente)+'</b><div class="muted">'+esc(b.servico)+'<br>WhatsApp: '+link+'</div></div><button type="button" class="d" data-id="'+esc(b.id)+'">Cancelar</button></div>'});
 $("ag").innerHTML=html+(lst.length?'':'<div class="box muted">Nenhum agendamento futuro.</div>')}
$("ag").onclick=async e=>{const btn=e.target.closest('button[data-id]');if(!btn)return;const id=btn.dataset.id;
 if(!confirm("Cancelar este agendamento? O horário voltará a ficar livre. Essa operação não envia mensagem automática para a cliente."))return;
 btn.disabled=true;const {error}=await db.from("agendamentos").delete().eq("id",id);
 if(error){console.error(error);toast("Erro ao cancelar agendamento")}else{toast("Agendamento cancelado. Avise a cliente pelo WhatsApp.");await loadAg()}btn.disabled=false};
// SERVIÇOS E PREÇOS
const CATS=["Cílios","Sobrancelha","Epilação","Combos"];
const opts=sel=>CATS.map(c=>'<option value="'+c+'" '+(sel===c?'selected':'')+'>'+c+'</option>').join('');
async function loadSv(){const {data,error}=await db.from("keyla_services").select("*").order("sort").order("name");if(error)return fail("sv",error);
 $("sv").innerHTML='<div class="box"><h3>Serviços do site</h3><p class="muted">Altere preços, descrições e visibilidade. Os cartões do site serão atualizados quando a página for recarregada.</p></div>'+
 (data||[]).map(s=>'<div class="box" data-id="'+s.id+'"><div class="row"><div><label>Nome</label><input class="n" value="'+esc(s.name)+'"></div><div><label>Categoria</label><select class="cg">'+opts(s.category)+'</select></div><div class="sm"><label>Preço R$</label><input class="pr" type="number" step="0.01" min="0" value="'+esc(s.price)+'"></div><div class="sm"><label>Preço anterior (opcional)</label><input class="old" type="number" step="0.01" min="0" value="'+esc(s.old_price??'')+'"></div></div><label>Descrição</label><textarea class="ds" rows="2">'+esc(s.description)+'</textarea><div class="row"><label style="flex:1 1 170px"><input class="ac" type="checkbox" style="width:auto" '+(s.active?'checked':'')+'> Visível no site</label><button type="button" class="p" data-a="save">Salvar</button><button type="button" class="d" data-a="del">Excluir</button></div></div>').join('')+
 '<div class="box"><h3>Adicionar serviço</h3><div class="row"><div><label>Nome</label><input id="nn" placeholder="Nome do serviço"></div><div><label>Categoria</label><select id="nc">'+opts('Cílios')+'</select></div><div class="sm"><label>Preço R$</label><input id="np" type="number" min="0" step="0.01"></div><div class="sm"><label>Preço anterior</label><input id="no" type="number" min="0" step="0.01"></div></div><label>Descrição</label><textarea id="nd" rows="2"></textarea><button type="button" class="p" id="add" style="margin-top:14px">+ Adicionar</button></div>';
 $("add").onclick=async()=>{if(!$("nn").value.trim())return toast("Informe o nome do serviço");if($("np").value===''||+$("np").value<0)return toast("Informe o preço válido");
 const {error}=await db.from("keyla_services").insert({name:$("nn").value.trim(),category:$("nc").value,price:+$("np").value,old_price:$("no").value===''?null:+$("no").value,description:$("nd").value,active:true,sort:99});
 if(error){console.error(error);toast("Erro: nome duplicado ou dados inválidos")}else{toast("Serviço adicionado");loadSv()}}}
$("sv").onclick=async e=>{const btn=e.target.closest("button[data-a]");if(!btn)return;const a=btn.dataset.a,box=btn.closest('[data-id]'),id=box?.dataset.id;if(!id)return;
 if(a==='save'){const price=box.querySelector('.pr').value;if(price===''||Number(price)<0)return toast("Preço inválido");const name=box.querySelector('.n').value.trim();if(!name)return toast("Informe o nome");
 const {error}=await db.from('keyla_services').update({name,category:box.querySelector('.cg').value,price:Number(price),old_price:box.querySelector('.old').value===''?null:Number(box.querySelector('.old').value),description:box.querySelector('.ds').value,active:box.querySelector('.ac').checked}).eq('id',id);if(error){console.error(error);toast("Erro ao salvar")}else{toast("Serviço salvo");loadSv()}}
 if(a==='del'&&confirm('Excluir este serviço?')){const {error}=await db.from('keyla_services').delete().eq('id',id);if(error){console.error(error);toast('Erro ao excluir')}else{toast('Serviço excluído');loadSv()}}};
// DISPONIBILIDADE
async function loadDi(){const {data,error}=await db.from('keyla_blocked').select('*').gte('dia',hoje).order('dia').order('hora');if(error)return fail('di',error);
 const hs=cfg.horarios.split(',').map(h=>h.trim()).filter(h=>/^([01]\d|2[0-3]):[0-5]\d$/.test(h));
 $("di").innerHTML='<div class="box"><h3>Bloquear dia ou horário</h3><p class="muted">O bloqueio fica visível como indisponível no site. Se já houver agendamento, cancele-o separadamente e avise a cliente.</p><div class="row"><div><label>Data</label><input type="date" id="bd" min="'+hoje+'"></div><div><label>Horário</label><select id="bh"><option value="">Dia inteiro</option>'+hs.map(h=>'<option>'+esc(h)+'</option>').join('')+'</select></div><div><label>Motivo (privado)</label><input id="bm" placeholder="Ex.: Folga"></div><button type="button" id="bb" class="p">Bloquear</button></div></div>'+
 (data||[]).map(b=>'<div class="box row"><span><b>'+br(b.dia)+'</b> · '+(b.hora?esc(String(b.hora).slice(0,5)):'Dia inteiro')+' <span class="muted">'+esc(b.motivo||'')+'</span></span><button type="button" class="d" data-id="'+b.id+'">Liberar</button></div>').join('')+((data||[]).length?'':'<p class="muted">Nenhuma data bloqueada.</p>');
 $("bb").onclick=async()=>{if(!$("bd").value)return toast('Escolha uma data');const {error}=await db.from('keyla_blocked').insert({dia:$("bd").value,hora:$("bh").value||null,motivo:$("bm").value});if(error){console.error(error);toast('Erro ao bloquear ou bloqueio já existente')}else{toast('Horário bloqueado');loadDi()}}}
$("di").onclick=async e=>{const btn=e.target.closest('button[data-id]');if(!btn)return;const {error}=await db.from('keyla_blocked').delete().eq('id',btn.dataset.id);if(error){console.error(error);toast('Erro ao liberar')}else{toast('Bloqueio removido');loadDi()}};
// CONFIGURAÇÕES DO SITE
function loadSt(){const textKeys=new Set(['intro','booking_intro']);const defs=[['slogan','Título da capa'],['intro','Texto da capa'],['booking_intro','Texto do agendamento'],['whatsapp','WhatsApp (55 + DDD + número)'],['address','Endereço'],['hours_text','Horários exibidos no contato'],['instagram','Instagram'],['horarios','Horários oferecidos (HH:MM separados por vírgula)']];
 $('st').innerHTML='<div class="box"><h3>Identidade e informações da Keyla</h3><p class="muted">A identidade visual preto e dourado do site não muda; aqui você edita somente o conteúdo.</p>'+defs.map(([k,l])=>'<label for="s_'+k+'">'+l+'</label>'+(textKeys.has(k)?'<textarea id="s_'+k+'">'+esc(cfg[k])+'</textarea>':'<input id="s_'+k+'" value="'+esc(cfg[k])+'">')).join('')+'<button id="ss" class="p" style="width:100%;margin-top:18px" type="button">Salvar alterações do site</button></div><div class="box"><h3>Verificação do banco</h3><p class="muted">Confere se site e painel estão conectados ao Supabase.</p><button id="dg" class="p" type="button">Verificar agora</button><div id="dgo" style="margin-top:14px"></div></div>';
 $('dg').onclick=diag;$('ss').onclick=async()=>{const dados=Object.keys(DEF).map(key=>({key,value:$("s_"+key).value.trim()}));const hs=dados.find(r=>r.key==='horarios').value.split(',').map(s=>s.trim());if(!hs.length||hs.some(s=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(s)))return toast('Use horários como 08:00,14:00,19:00');const w=dados.find(r=>r.key==='whatsapp').value.replace(/\D/g,'');if(w.length<12||w.length>13)return toast('WhatsApp inválido: informe 55 + DDD + número');dados.find(r=>r.key==='whatsapp').value=w;
 const {error}=await db.from('keyla_settings').upsert(dados,{onConflict:'key'});if(error){console.error(error);toast('Erro ao salvar configurações')}else{toast('Configurações atualizadas');await loadCfg();loadDi();loadSt()}}};
/* FOTOS */

const FS=["title","price","image_url","fit","zoom","ox","oy","bright","contrast","active","sort"];
const tf=r=>`transform:translate(${+r.ox||0}%,${+r.oy||0}%) scale(${+r.zoom||1});filter:brightness(${+r.bright||100}%) contrast(${+r.contrast||100}%)`;
let FL=[],E=null,pickMode="new";
async function loadFt(){
 const [{data,error},sv]=await Promise.all([db.from("keyla_photos").select("*").order("sort"),db.from("keyla_services").select("name")]);
 $("svn").innerHTML=(sv.data||[]).map(x=>`<option>${esc(x.name)}</option>`).join("");
 if(error){$("ft").innerHTML='<div class="box"><b>A galeria de fotos ainda não foi criada no banco.</b><p class="muted">Aplique o arquivo keyla_setup.sql no Supabase e recarregue esta página.</p></div>';return}
 FL=data||[];
 $("ft").innerHTML=`<div class="box"><h3>Fotos dos resultados</h3><p class="muted">Aparecem na seção Resultados do site, na ordem abaixo.</p><button class="p" id="fadd" type="button">+ Adicionar foto</button></div>`+
 FL.map((r,i)=>`<div class="box ph-row" data-id="${r.id}"><div class="th ${r.fit==="contain"?"ct":""}" style="--im:url('${esc(r.image_url)}')"><img src="${esc(r.image_url)}" alt="" style="${tf(r)}"></div>
 <div><b>${esc(r.title)}</b><div class="muted">${r.price!=null&&r.price!==""?R(r.price):"Sem valor"}${r.active?"":" · escondida"}</div></div>
 <div class="row" style="flex:0 0 auto;flex-direction:column;gap:6px"><div class="row" style="gap:6px"><button type="button" data-a="up" ${i?"":"disabled"}>▲</button><button type="button" data-a="dn" ${i<FL.length-1?"":"disabled"}>▼</button></div><button class="p" type="button" data-a="ed">Editar</button><button class="d" type="button" data-a="del">Excluir</button></div></div>`).join("")+(FL.length?"":'<p class="muted">Nenhuma foto ainda.</p>');
 $("fadd").onclick=()=>{pickMode="new";$("fpick").click()}}
$("ft").onclick=async e=>{const a=e.target.dataset.a,box=e.target.closest("[data-id]");if(!a||!box)return;
 const i=FL.findIndex(x=>String(x.id)===box.dataset.id),r=FL[i];
 if(a==="ed")return openE(r);
 if(a==="del"){if(!confirm("Excluir esta foto do site?"))return;await db.from("keyla_photos").delete().eq("id",r.id);toast("Foto excluída");return loadFt()}
 const o=FL[a==="up"?i-1:i+1];if(!o)return;
 await db.from("keyla_photos").update({sort:o.sort}).eq("id",r.id);await db.from("keyla_photos").update({sort:r.sort}).eq("id",o.id);loadFt()};
async function prep(file){const u=URL.createObjectURL(file);
 const im=await new Promise((ok,no)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=no;x.src=u});
 const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
 c.getContext("2d").drawImage(im,0,0,c.width,c.height);
 URL.revokeObjectURL(u);return new Promise(ok=>c.toBlob(ok,"image/jpeg",.85))}
async function sendImg(file){const b=await prep(file);
 const name=(crypto.randomUUID?crypto.randomUUID():Date.now())+".jpg";
 const {error}=await db.storage.from("keyla-fotos").upload(name,b,{contentType:"image/jpeg"});
 if(error)throw error;return db.storage.from("keyla-fotos").getPublicUrl(name).data.publicUrl}
$("fpick").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{if(!f.type.startsWith("image/"))throw Error("Arquivo inválido");if(f.size>15*1024*1024)throw Error("Imagem maior que 15 MB");toast("Enviando foto...");const url=await sendImg(f);
  if(pickMode==="new")openE({title:"",price:null,image_url:url,fit:"cover",zoom:1,ox:0,oy:0,bright:100,contrast:100,active:true,sort:(FL.reduce((a,x)=>Math.max(a,x.sort||0),0)+1)});
  else{E.image_url=url;applyE()}}catch(err){console.error(err);toast("Não foi possível enviar a foto")}};
function applyE(){const i=$("fi");i.src=E.image_url;$("fr").style.setProperty("--im",`url('${E.image_url}')`);$("fr").classList.toggle("ct",E.fit==="contain");
 i.style.cssText=tf(E);$("fcn").textContent=E.title||"Nome da foto";$("fcp").textContent=E.price!=null&&E.price!==""?R(E.price):"";$("zv").textContent=(+E.zoom).toFixed(2)+"x"}
function openE(r){E={fit:"cover",zoom:1,ox:0,oy:0,bright:100,contrast:100,active:true,sort:99,...r};$("edt").textContent=r.id?"Editar foto":"Nova foto";
 $("e_t").value=E.title;$("e_p").value=E.price??"";$("e_z").value=E.zoom;$("e_b").value=E.bright;$("e_c").value=E.contrast;$("e_f").value=E.fit;$("e_a").checked=!!E.active;
 $("ed").classList.remove("hide");applyE()}
const lim=()=>(E.zoom-1)*50+15,cl=v=>Math.max(-lim(),Math.min(lim(),v));
$("e_t").oninput=e=>{E.title=e.target.value;applyE()};
$("e_p").oninput=e=>{E.price=e.target.value===""?null:Number(e.target.value);applyE()};
$("e_z").oninput=e=>{E.zoom=+e.target.value;E.ox=cl(E.ox);E.oy=cl(E.oy);applyE()};
$("e_b").oninput=e=>{E.bright=+e.target.value;applyE()};$("e_c").oninput=e=>{E.contrast=+e.target.value;applyE()};
$("e_f").onchange=e=>{E.fit=e.target.value;applyE()};$("e_a").onchange=e=>E.active=e.target.checked;
$("e_rs").onclick=()=>{E.zoom=1;E.ox=0;E.oy=0;E.bright=100;E.contrast=100;$("e_z").value=1;$("e_b").value=100;$("e_c").value=100;applyE()};
$("e_ph").onclick=()=>{pickMode="swap";$("fpick").click()};
$("e_x").onclick=()=>$("ed").classList.add("hide");
let dr=null;const fr=$("fr");
fr.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY,ox:E.ox,oy:E.oy};fr.setPointerCapture(e.pointerId);fr.style.cursor="grabbing"};
fr.onpointermove=e=>{if(!dr)return;const r=fr.getBoundingClientRect();E.ox=cl(dr.ox+(e.clientX-dr.x)/r.width*100);E.oy=cl(dr.oy+(e.clientY-dr.y)/r.height*100);applyE()};
fr.onpointerup=fr.onpointercancel=()=>{dr=null;fr.style.cursor="grab"};
fr.onwheel=e=>{e.preventDefault();E.zoom=Math.max(1,Math.min(3,E.zoom-e.deltaY*.002));E.ox=cl(E.ox);E.oy=cl(E.oy);$("e_z").value=E.zoom;applyE()};
$("e_s").onclick=async()=>{if(!E.title.trim())return toast("Dê um nome à foto");
 const d={};FS.forEach(k=>d[k]=E[k]);d.title=d.title.trim();
 const {error}=E.id?await db.from("keyla_photos").update(d).eq("id",E.id):await db.from("keyla_photos").insert(d);
 if(error){console.error(error);return toast("Erro ao salvar a foto")}
 $("ed").classList.add("hide");toast("Foto salva");loadFt()};

// VERIFICAÇÃO DO BANCO
async function diag(){const o=$("dgo");o.innerHTML='<p class="muted">Verificando...</p>';const L=[];
 const add=(n,e)=>L.push('<div>'+(e?'<span style="color:var(--red)">✖</span> ':'<span style="color:var(--gold-light)">✔</span> ')+esc(n)+(e?' <span class="muted">— '+esc(e.message||e.code||'erro')+'</span>':'')+'</div>');
 for(const t of["agendamentos","keyla_settings","keyla_services","keyla_blocked","keyla_photos"]){const r=await db.from(t).select("*",{count:"exact",head:true});add("Tabela "+t,r.error)}
 let r=await db.rpc("keyla_is_admin");add("Função keyla_is_admin",r.error||(r.data===true?null:{message:"este login não é administrador"}));
 r=await db.rpc("keyla_horarios_indisponiveis",{dia:hoje});add("Função keyla_horarios_indisponiveis",r.error);
 r=await db.storage.from("keyla-fotos").list("",{limit:1});add("Pasta de fotos keyla-fotos",r.error);
 o.innerHTML=L.join("")}
// Atualiza a agenda sozinho (reservas novas aparecem sem recarregar)
setInterval(()=>{if(!document.hidden&&!$("app").classList.contains("hide")&&!$("ag").classList.contains("hide"))loadAg()},30000);

boot();
</script>
