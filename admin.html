const sb=supabase.createClient('https://runlbupeeyyfpzshdczz.supabase.co','sb_publishable_NfXfzvCAxGktXCeL0PE_rw_wAcg0qJh');
const $=id=>document.getElementById(id),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),br=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—',localDay=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Fortaleza',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),phone=s=>String(s||'').replace(/\D/g,'');
const sections={dashboard:'Início',agenda:'Agenda',bookings:'Agendamentos',clients:'Clientes',finance:'Financeiro',services:'Serviços',photos:'Fotos',blocks:'Disponibilidade',reminders:'Lembretes',maintenance:'Manutenções',reports:'Relatórios',settings:'Configurações'};
let page='dashboard',data={clients:[],appointments:[],services:[],photos:[],blocks:[],settings:[]},user=null,helpIndex=0;
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4500)}
async function q(table){let r=await sb.from(table).select('*');if(r.error)throw r.error;return r.data||[]}
async function load(){try{const [clients,appointments,services,photos,blocks,settings]=await Promise.all([q('kl_clients'),q('kl_appointments'),q('kl_services'),q('kl_photos'),q('kl_blocks'),q('kl_settings')]);data={clients,appointments,services,photos,blocks,settings};draw()}catch(e){toast('Falha ao carregar: '+e.message)}}
function setting(k,def){return data.settings.find(x=>x.key===k)?.value||def}
function nameOf(id){return data.clients.find(x=>x.id===id)?.name||'Cliente'}
function active(){return data.appointments.filter(x=>x.status==='scheduled')}
function completed(){return data.appointments.filter(x=>x.status==='done')}
function range(d,type){const now=localDay(),m=now.slice(0,7);if(type==='today')return d===now;if(type==='month')return d.startsWith(m);if(type==='week'){const t=new Date(now+'T12:00:00'),s=new Date(t);s.setDate(t.getDate()-((t.getDay()+6)%7));const e=new Date(s);e.setDate(s.getDate()+7);return new Date(d+'T12:00:00')>=s&&new Date(d+'T12:00:00')<e}return true}
function earned(type){return completed().filter(b=>range(b.day,type)).reduce((n,b)=>n+Number(b.price),0)}
function tile(title,val,desc=''){return `<div class="tile"><span class="muted">${title}</span><b>${val}</b><span class="mini">${desc}</span></div>`}
const homeIcons={dashboard:'🏠',agenda:'📅',bookings:'🗓️',clients:'👥',finance:'💰',services:'✨',photos:'📸',blocks:'🔒',reminders:'🔔',maintenance:'💛',reports:'📊',settings:'⚙️'};
function homeMenu(){return `<h3 class="home-menu-title">Seu espaço de trabalho</h3><p class="home-intro">Escolha uma opção para gerenciar seu negócio.</p><div class="home-menu">${Object.entries(sections).filter(([id])=>id!=='dashboard').map(([id,label])=>`<button type="button" class="home-card" onclick="go('${id}')" aria-label="Abrir ${label}"><span class="home-icon" aria-hidden="true">${homeIcons[id]}</span><span class="home-label">${label}</span></button>`).join('')}</div>`}
function nav(){ $('nav').innerHTML=Object.entries(sections).map(([id,label])=>`<button class="${id===page?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}
function go(p){page=p;helpIndex=0;$('bubble').classList.add('hidden');draw();window.scrollTo({top:0,behavior:'smooth'})}
function draw(){nav();$('heading').textContent=sections[page];const c=$('content');if(page==='dashboard'){c.innerHTML=`${homeMenu()}<h3 class="home-menu-title">Resumo do negócio</h3><div class="tiles">${tile('Atendimentos hoje',active().filter(b=>b.day===localDay()).length)}${tile('Próximos agendamentos',active().filter(b=>b.day>=localDay()).length)}${tile('Clientes',data.clients.length)}${tile('Faturamento realizado',money(earned('all')))}</div><div class="panel"><h3>Visão geral</h3><p>Seus dados são sincronizados com o Supabase. Os valores financeiros consideram apenas atendimentos concluídos.</p><button class="btn primary" onclick="go('agenda')">Abrir agenda</button></div>`}
else if(page==='agenda'){let start=localDay();let list=active().filter(b=>b.day>=start).sort((a,b)=>(a.day+a.hour).localeCompare(b.day+b.hour));c.innerHTML=`<div class="panel"><h3>Próximos horários</h3>${list.map(b=>`<div class="panel"><b>${br(b.day)} às ${String(b.hour).slice(0,5)}</b> — ${safe(nameOf(b.client_id))}<div class="mini">${safe(b.service_name)} · ${money(b.price)}</div><button class="btn" onclick="go('bookings')">Gerenciar</button></div>`).join('')||'Sem agendamentos futuros'}</div>`}
else if(page==='bookings'){c.innerHTML=`<div class="panel"><h3>Agendamento manual</h3><form id="manual"><div class="grid"><div><label>Cliente</label><select name="client" required><option value="">Selecione</option>${data.clients.map(x=>`<option value="${x.id}">${safe(x.name)} — ${safe(x.phone)}</option>`).join('')}</select></div><div><label>Serviço</label><select name="service" required>${data.services.filter(x=>x.active).map(x=>`<option value="${x.id}">${safe(x.name)} — ${money(x.price)}</option>`).join('')}</select></div><div><label>Data (a partir de amanhã)</label><input name="day" type="date" required min="${tomorrow()}"></div><div><label>Horário</label><select name="hour">${setting('times','08:00,14:00,19:00').split(',').map(t=>`<option>${t}</option>`).join('')}</select></div></div><p><button class="btn primary">Agendar</button></p></form></div><div class="panel scroll"><table><thead><tr><th>Cliente</th><th>Data/hora</th><th>Serviço</th><th>Valor</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${[...data.appointments].sort((a,b)=>(b.day+b.hour).localeCompare(a.day+a.hour)).map(b=>`<tr><td>${safe(nameOf(b.client_id))}</td><td>${br(b.day)} ${String(b.hour).slice(0,5)}</td><td>${safe(b.service_name)}</td><td>${money(b.price)}</td><td>${safe(b.status)}</td><td><select onchange="statusChange('${b.id}',this.value)"><option value="">Alterar</option>${[['scheduled','Agendado'],['done','Concluído'],['cancel','Cancelado'],['missed','Faltou']].map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`;$('manual').onsubmit=manual}
else if(page==='clients'){c.innerHTML=`<div class="panel"><h3>Cadastrar cliente</h3><form id="newClient" class="grid"><div><label>Nome</label><input name="name" required minlength="2" maxlength="80"></div><div><label>WhatsApp (DDD + 9 dígitos)</label><input name="phone" required inputmode="numeric" pattern="[0-9]{11}" minlength="11" maxlength="11" placeholder="85999999999"></div><div><label>&nbsp;</label><button class="btn primary">Salvar cliente</button></div></form></div>${data.clients.map(x=>`<div class="panel"><div class="row between"><div><b>${safe(x.name)}</b><p class="mini">${safe(x.phone)} · ${data.appointments.filter(b=>b.client_id===x.id).length} agendamento(s)</p></div><button class="btn" onclick="clientNote('${x.id}')">Histórico e observações</button></div></div>`).join('')}`;$('newClient').onsubmit=newClient}
else if(page==='finance'){let goal=Number(setting('weekly_goal','700')),value=earned('week');c.innerHTML=`<div class="tiles">${tile('Hoje',money(earned('today')))}${tile('Semana',money(value))}${tile('Mês',money(earned('month')))}${tile('Total',money(earned('all')))}</div><div class="panel"><h3>Meta semanal: ${money(goal)}</h3><progress value="${Math.min(value,goal)}" max="${Math.max(goal,1)}" style="width:100%;height:24px"></progress><p>${value>=goal?'Meta atingida!':`Faltam ${money(goal-value)} para alcançar sua meta.`}</p><p class="mini">Agendamentos futuros não entram no faturamento realizado.</p></div>`}
else if(page==='services'){c.innerHTML=`<div class="panel"><h3>Adicionar serviço</h3><form id="newService" class="grid"><div><label>Nome</label><input name="name" required></div><div><label>Categoria</label><input name="category" value="Cílios" required></div><div><label>Preço (R$)</label><input name="price" type="number" min="0" step="0.01" required></div><div><label>&nbsp;</label><button class="btn primary">Adicionar</button></div></form></div>${data.services.map(s=>`<div class="panel row between"><div><b>${safe(s.name)}</b><div class="mini">${safe(s.category)} · ${money(s.price)} · ${s.active?'Ativo':'Inativo'}</div></div><div class="row"><button class="btn" onclick="editService('${s.id}')">Editar</button><button class="btn ${s.active?'danger':''}" onclick="toggleService('${s.id}',${!s.active})">${s.active?'Desativar':'Ativar'}</button></div></div>`).join('')}`;$('newService').onsubmit=newService}
else if(page==='photos'){c.innerHTML=`<div class="panel"><h3>Adicionar foto à galeria</h3><form id="newPhoto" class="grid"><div><label>Título</label><input name="title" required></div><div><label>Enviar foto do celular ou computador</label><input name="photo_file" type="file" accept="image/jpeg,image/png,image/webp"><label>Ou URL da imagem (HTTPS)</label><input name="image_url" type="url" pattern="https://.*"></div><div><label>Preço opcional</label><input name="price" type="number" min="0" step="0.01"></div><div><label>&nbsp;</label><button class="btn primary">Adicionar foto</button></div></form></div><div class="tiles">${data.photos.map(x=>`<div class="panel"><img src="${safe(x.image_url)}" alt="${safe(x.title)}" style="width:100%;height:180px;object-fit:cover;border-radius:12px"><b>${safe(x.title)}</b><p><button class="btn danger" onclick="removePhoto('${x.id}')">Remover</button></p></div>`).join('')}</div>`;$('newPhoto').onsubmit=newPhoto}
else if(page==='blocks'){c.innerHTML=`<div class="panel"><h3>Bloquear horário ou dia</h3><form id="newBlock" class="grid"><div><label>Data</label><input name="day" type="date" min="${localDay()}" required></div><div><label>Horário</label><select name="hour"><option value="">Dia inteiro</option>${setting('times','08:00,14:00,19:00').split(',').map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Motivo</label><input name="reason" placeholder="Folga, feriado..."></div><div><label>&nbsp;</label><button class="btn primary">Bloquear</button></div></form></div>${data.blocks.map(b=>`<div class="panel row between"><span>${br(b.day)} · ${b.hour?String(b.hour).slice(0,5):'Dia inteiro'} — ${safe(b.reason)}</span><button class="btn danger" onclick="removeBlock('${b.id}')">Desbloquear</button></div>`).join('')}`;$('newBlock').onsubmit=newBlock}
else if(page==='reminders'){c.innerHTML=`<div class="panel"><h3>Lembretes pelo WhatsApp</h3><p class="mini">Envio manual. Mensagens automáticas para a empresária exigem configuração do servidor de notificações push.</p>${active().filter(b=>b.day>=localDay()).map(b=>`<div class="panel row between"><span>${safe(nameOf(b.client_id))} — ${br(b.day)} às ${String(b.hour).slice(0,5)}</span><button class="btn" onclick="whats('${b.id}')">Enviar WhatsApp</button></div>`).join('')||'Nenhum lembrete pendente'}</div>`}
else if(page==='maintenance'){let days=Number(setting('maintenance_days','15'));let done=completed();c.innerHTML=`<div class="panel"><h3>Retornos sugeridos (${days} dias)</h3>${done.map(b=>`<div class="panel row between"><span>${safe(nameOf(b.client_id))} — Último atendimento ${br(b.day)} · Retorno ${br(addDays(b.day,days))}</span><button class="btn" onclick="whatsMaintenance('${b.id}')">WhatsApp</button></div>`).join('')||'Sem atendimentos concluídos'}</div>`}
else if(page==='reports'){let all=data.appointments,done=completed();let stats={};done.forEach(b=>stats[b.service_name]=(stats[b.service_name]||0)+1);c.innerHTML=`<div class="tiles">${tile('Clientes',data.clients.length)}${tile('Atendimentos concluídos',done.length)}${tile('Cancelamentos',all.filter(b=>b.status==='cancel').length)}${tile('Faturamento total',money(earned('all')))}</div><div class="panel"><h3>Serviços mais realizados</h3>${Object.entries(stats).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<p>${safe(n)} — ${v}</p>`).join('')||'Ainda não há dados.'}</div>`}
else if(page==='settings'){c.innerHTML=`<div class="panel"><form id="settingsForm"><label>Horários (HH:MM separados por vírgula)</label><input name="times" required value="${safe(setting('times','08:00,14:00,19:00'))}"><label>Meta semanal (R$)</label><input name="weekly_goal" type="number" min="0" step="0.01" value="${safe(setting('weekly_goal','700'))}"><label>Manutenção sugerida (dias)</label><input name="maintenance_days" type="number" min="1" value="${safe(setting('maintenance_days','15'))}"><p><button class="btn primary">Salvar configurações</button></p></form></div><div class="panel"><h3>Aplicativo no iPhone</h3><p>Abra esta página no Safari e escolha Compartilhar → Adicionar à Tela de Início.</p><button class="btn primary" onclick="askNotifications()">Ativar notificações neste iPhone</button> <button class="btn" onclick="disableNotifications()">Desativar neste aparelho</button><p id="pushStatus" class="mini">Para receber avisos com o aplicativo fechado, instale o app na Tela de Início pelo Safari e autorize as notificações. O envio depende de conexão à internet e da entrega pelo iOS.</p></div>`;$('settingsForm').onsubmit=saveSettings}
}
function tomorrow(){let d=new Date(localDay()+'T12:00:00');d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(day,n){let d=new Date(day+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
async function write(table,values,id){let r=id?await sb.from(table).update(values).eq('id',id):await sb.from(table).insert(values);if(r.error)throw r.error;await load();toast('Salvo com sucesso')}
async function run(fn){try{await fn()}catch(e){toast('Não foi possível: '+e.message);await load()}}
async function newClient(e){e.preventDefault();let f=e.target;await run(()=>write('kl_clients',{name:f.elements['name'].value.trim(),phone:phone(f.elements['phone'].value)}))}
async function newService(e){e.preventDefault();let f=e.target;await run(()=>write('kl_services',{name:f.elements['name'].value.trim(),category:f.elements['category'].value.trim(),price:Number(f.elements['price'].value)}))}
async function toggleService(id,active){await run(()=>write('kl_services',{active},id))}
async function editService(id){let s=data.services.find(x=>x.id===id),n=prompt('Nome do serviço',s.name);if(n===null)return;let p=prompt('Preço (R$)',s.price);if(p===null)return;if(!n.trim()||!Number.isFinite(Number(p))||Number(p)<0)return toast('Dados inválidos');await run(()=>write('kl_services',{name:n.trim(),price:Number(p)},id))}
async function newPhoto(e){
 e.preventDefault();const f=e.target;
 await run(async()=>{
  let image_url=f.elements['image_url'].value.trim();const file=f.elements['photo_file'].files[0];
  if(file){
   if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Use JPG, PNG ou WebP');
   if(file.size>8*1024*1024)throw Error('Foto muito grande: máximo 8 MB');
   const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type];
   const path='procedimentos/'+crypto.randomUUID()+'.'+ext;
   const up=await sb.storage.from('keyla-fotos').upload(path,file,{contentType:file.type,upsert:false});
   if(up.error)throw up.error;
   image_url=sb.storage.from('keyla-fotos').getPublicUrl(path).data.publicUrl;
  }
  if(!/^https:\/\//.test(image_url))throw Error('Selecione uma foto ou informe uma URL HTTPS');
  await write('kl_photos',{title:f.elements['title'].value.trim(),image_url,price:f.elements['price'].value?Number(f.elements['price'].value):null});
 });
}
async function removePhoto(id){if(!confirm('Remover foto?'))return;await run(async()=>{let r=await sb.from('kl_photos').delete().eq('id',id);if(r.error)throw r.error;await load()})}
async function newBlock(e){e.preventDefault();let f=e.target;let day=f.elements['day'].value,hour=f.elements['hour'].value||null;if(active().some(b=>b.day===day&&(!hour||String(b.hour).slice(0,5)===hour)))return toast('Já existe atendimento neste período. Remarque antes de bloquear.');await run(()=>write('kl_blocks',{day,hour,reason:f.elements['reason'].value.trim()}))}
async function removeBlock(id){if(!confirm('Desbloquear este horário?'))return;await run(async()=>{let r=await sb.from('kl_blocks').delete().eq('id',id);if(r.error)throw r.error;await load()})}
async function manual(e){e.preventDefault();let f=e.target,c=data.clients.find(x=>x.id===f.elements['client'].value),s=data.services.find(x=>x.id===f.elements['service'].value);if(!c||!s)return;if(f.elements['day'].value<=localDay())return toast('Selecione uma data futura.');await run(async()=>{let r=await sb.rpc('kl_book',{p_name:c.name,p_phone:c.phone,p_service:s.id,p_day:f.elements['day'].value,p_hour:f.elements['hour'].value});if(r.error)throw r.error;await load();toast('Agendamento confirmado')})}
async function statusChange(id,status){if(!status)return;if(!confirm('Alterar situação para '+status+'?'))return;await run(()=>write('kl_appointments',{status},id))}
async function saveSettings(e){e.preventDefault();let f=e.target;let times=f.elements['times'].value.split(',').map(s=>s.trim());if(!times.length||times.some(x=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(x)))return toast('Horários inválidos');await run(async()=>{for(let [key,value] of [['times',times.join(',')],['weekly_goal',String(Number(f.elements['weekly_goal'].value))],['maintenance_days',String(Number(f.elements['maintenance_days'].value))]]){let r=await sb.from('kl_settings').upsert({key,value});if(r.error)throw r.error}await load();toast('Configurações salvas')})}
function whats(id){let b=data.appointments.find(x=>x.id===id),c=data.clients.find(x=>x.id===b.client_id);if(!c)return;window.open('https://wa.me/55'+c.phone+'?text='+encodeURIComponent(`Olá, ${c.name}! 💛 Lembrando do seu atendimento de ${b.service_name} em ${br(b.day)} às ${String(b.hour).slice(0,5)}.`),'_blank','noopener')}
function whatsMaintenance(id){let b=data.appointments.find(x=>x.id===id),c=data.clients.find(x=>x.id===b.client_id);if(!c)return;window.open('https://wa.me/55'+c.phone+'?text='+encodeURIComponent(`Olá, ${c.name}! 💛 Está chegando a época da sua manutenção. Gostaria de agendar um retorno?`),'_blank','noopener')}
function clientNote(id){let c=data.clients.find(x=>x.id===id);let history=data.appointments.filter(x=>x.client_id===id).map(x=>`${br(x.day)} ${String(x.hour).slice(0,5)} — ${x.service_name} (${x.status})`).join('\n');let notes=prompt('HISTÓRICO:\n'+(history||'Nenhum atendimento')+'\n\nOBSERVAÇÕES (edite abaixo):',c.notes||'');if(notes!==null)run(()=>write('kl_clients',{notes},id))}
function b64ToBytes(str){let pad='='.repeat((4-str.length%4)%4);let raw=atob((str+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function askNotifications(){
 if(!user)return toast('Entre com a conta da empresária.');
 if(!window.isSecureContext||!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window))return toast('Instale pelo Safari em um iPhone atualizado, em um endereço HTTPS.');
 try{
  const reg=await navigator.serviceWorker.ready;
  const permission=await Notification.requestPermission();
  if(permission!=='granted')return toast('Notificações não autorizadas.');
  const {data:key,error:keyError}=await sb.rpc('kl_push_public_key');if(keyError||!key)throw keyError||Error('Chave VAPID indisponível');
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(key)});
  const payload=sub.toJSON();
  const {error}=await sb.from('kl_push_subscriptions').upsert({user_id:user.id,endpoint:sub.endpoint,p256dh:payload.keys.p256dh,auth_key:payload.keys.auth,expiration_time:sub.expirationTime?new Date(sub.expirationTime).toISOString():null},{onConflict:'endpoint'});
  if(error)throw error;
  toast('Notificações push ativadas neste aparelho! 💛');
  const status=document.getElementById('pushStatus');if(status)status.textContent='Notificações ativadas neste aparelho. Você receberá avisos de novos agendamentos e lembretes.';
 }catch(e){toast('Não foi possível ativar: '+(e.message||String(e)))}
}
async function disableNotifications(){
 try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){const {error}=await sb.from('kl_push_subscriptions').delete().eq('endpoint',sub.endpoint).eq('user_id',user.id);if(error)throw error;await sub.unsubscribe()}toast('Notificações desativadas neste aparelho.')}catch(e){toast('Falha ao desativar: '+e.message)}
}

function advice(){let a=[],today=localDay(),future=active().filter(x=>x.day>=today).sort((x,y)=>(x.day+x.hour).localeCompare(y.day+y.hour)),goal=Number(setting('weekly_goal','700')),missing=goal-earned('week');if(page==='finance'){a.push(`Nesta semana você faturou ${money(earned('week'))}. ${missing>0?'Faltam '+money(missing)+' para sua meta!':'Parabéns, meta semanal alcançada!'} 💛`);let s=data.services.filter(x=>x.active&&Number(x.price)>0).sort((x,y)=>x.price-y.price)[0];if(s&&missing>0)a.push(`Com ${Math.ceil(missing/s.price)} atendimento(s) de ${s.name}, você ultrapassa sua meta semanal. ✨`)}if(page==='reports'){a.push(`RELATÓRIO COMPLETO
Clientes cadastradas: ${data.clients.length}
Agendamentos totais: ${data.appointments.length}
Agendados: ${active().length}
Concluídos: ${completed().length}
Cancelados: ${data.appointments.filter(x=>x.status==='cancel').length}
Faltas: ${data.appointments.filter(x=>x.status==='missed').length}
Faturamento hoje: ${money(earned('today'))}
Semana: ${money(earned('week'))}
Mês: ${money(earned('month'))}
Total: ${money(earned('all'))}
Meta semanal: ${money(goal)}.`)}if(future.length)a.push(`Seu próximo atendimento é ${br(future[0].day)} às ${String(future[0].hour).slice(0,5)}, com ${nameOf(future[0].client_id)}. ✨`);if(page==='clients')a.push(`Você já tem ${data.clients.length} cliente(s) cadastrada(s). Manter contato com elas ajuda na fidelização!`);if(page==='bookings'||page==='agenda')a.push('Confira a agenda antes de oferecer um novo horário. O sistema impede reservas duplicadas!');if(page==='services')a.push('Uma descrição clara dos serviços e preços atualizados ajuda suas clientes a escolherem com segurança.');if(page==='maintenance')a.push('Manutenções bem acompanhadas ajudam a fortalecer a relação com suas clientes.');if(page==='dashboard')a.push('Um ótimo atendimento começa com organização. Você está construindo uma experiência especial! 💛');if(!future.length)a.push('Sua agenda está tranquila. Que tal divulgar um horário disponível no Instagram? ✨');a.push('Seu trabalho transforma olhares e fortalece a autoestima. Continue brilhando! 💛');return a}
function dollClick(){let a=advice();$('bubble').textContent=a[helpIndex++%a.length];$('bubble').classList.remove('hidden')}
(function(){let d=$('doll'),h=$('assistant'),start=null,drag=false;d.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,l:h.getBoundingClientRect().left,t:h.getBoundingClientRect().top};drag=false;d.setPointerCapture(e.pointerId)});d.addEventListener('pointermove',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>7)drag=true;if(drag){h.style.left=Math.max(0,Math.min(innerWidth-75,start.l+dx))+'px';h.style.top=Math.max(0,Math.min(innerHeight-75,start.t+dy))+'px';h.style.right='auto';h.style.bottom='auto'}});d.addEventListener('pointerup',()=>{if(drag)localStorage.setItem('kl_doll_pos',JSON.stringify({left:h.style.left,top:h.style.top}));start=null});d.addEventListener('click',()=>{if(drag){drag=false;return}dollClick()});try{let p=JSON.parse(localStorage.getItem('kl_doll_pos'));if(p){h.style.left=p.left;h.style.top=p.top;h.style.right='auto';h.style.bottom='auto'}}catch{}})();
async function boot(){let {data:{user:u}}=await sb.auth.getUser();if(!u)return;let r=await sb.rpc('keyla_is_admin');if(r.error||r.data!==true){await sb.auth.signOut();toast('Conta sem permissão de administradora. Autorize o usuário em keyla_admins.');return}user=u;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('assistant').classList.remove('hidden');$('logout').classList.remove('hidden');$('userLabel').textContent=u.email;await load();sb.channel('keyla-admin-live').on('postgres_changes',{event:'*',schema:'public',table:'kl_appointments'},payload=>{load();toast(payload.eventType==='INSERT'?'Novo agendamento recebido!':'Agenda atualizada');if(payload.eventType==='INSERT'&&'Notification'in window&&Notification.permission==='granted')new Notification('Keyla Lash • Novo agendamento',{body:'Uma cliente acabou de reservar um horário.',icon:'./icon-192.png'})}).subscribe()}
$('login').onsubmit=async e=>{e.preventDefault();let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)return toast(r.error.message);await boot()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});boot();
</script></body></html>
